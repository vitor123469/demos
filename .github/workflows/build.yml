name: fabrica
on:
  push:
    paths: ['data/leads.json']
  workflow_dispatch:
    inputs:
      enviar:
        description: 'Enviar cards no Telegram? (sim/nao)'
        required: false
        default: 'sim'
permissions:
  contents: write
concurrency:
  group: fabrica
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build_and_notify
        env:
          TG: ${{ secrets.TG_BOT_TOKEN }}
          SEND: ${{ inputs.enviar == 'nao' && '0' || '1' }}
        run: python3 build.py
